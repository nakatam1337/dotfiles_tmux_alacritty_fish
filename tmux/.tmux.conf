# ============================================================
#  ~/.tmux.conf  —  Alt-key "direct" bindings (no prefix needed)
# ============================================================
#  All action keys live in the ROOT key table via `bind -n`
#  (shorthand for `bind -T root`), so they fire immediately and
#  skip tmux's default C-b prefix entirely.
#
#  Notes on the Alt/Meta modifier:
#    - `M-` in tmux means the Meta key, which is Alt on modern
#      keyboards. Terminals send it as a single ESC (^[) before
#      the key, e.g. M-c arrives as "^[c".
#    - Because ESC is also the start of function-key sequences,
#      tmux briefly waits after ESC to tell them apart. That is
#      the `escape-time` server option below (500ms default).
#    - tmux 3.5+ enables `extended-keys` by default; the settings
#      below only make sure the app-facing reports use xterm
#      sequences so tools like vim/fish are happy.
#
#  Reload after editing:
#    tmux source-file ~/.tmux.conf      (or Alt+: source-file ~/.tmux.conf)
#  List every binding (also Alt+?):
#    tmux list-keys -N
# ============================================================

# ------------------------------------------------------------
#  Options / general behaviour
# ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:extkeys"
set -as terminal-features ",xterm*:clipboard:ccolour:cstyle:focus:title"
set -g extended-keys on
set -g extended-keys-format xterm

set -s escape-time 50                 # snappier ESC / Alt handling
set -s set-clipboard on               # copy mode -> terminal clipboard (OSC 52)
set -g allow-passthrough on           # let panes use passthrough sequences
set -g focus-events on                # apps know when a pane gains focus
set -g history-limit 100000           # big scrollback
set -g base-index 1                   # windows start at 1
setw -g pane-base-index 1             # panes start at 1
set -g renumber-windows on            # no gaps in window numbers
set -g mouse on                       # click to focus, drag to resize/select
setw -g aggressive-resize on          # smaller panes when viewing from a small client
setw -g allow-rename off              # stop programs renaming windows behind your back
setw -g mode-keys vi                  # vim-style navigation in copy mode
set -g status-interval 5
set -sg repeat-time 600               # keep resize modes repeatable

# ------------------------------------------------------------
#  Theme  (→ status bar, pane borders, messages)
# ------------------------------------------------------------
set -g status-style "fg=colour250 bg=colour235"
set -g status-left "#[fg=colour231,bg=colour39,bold] #S #[fg=colour39,bg=colour235,nobold]"
set -g status-left-length 30
set -g status-right "#[fg=colour114]%H:%M %a %d-%b #[fg=colour97]#{?client_prefix,#[fg=colour214]PREFIX ,}#{?pane_in_mode,#[fg=colour203]COPY ,}#{?window_zoomed_flag,#[fg=colour214]ZOOM ,}#[fg=colour245]#H"
set -g status-right-length 120
set -g status-justify left
set -g status-position bottom

setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour245,bg=colour235] #I:#W#F "
setw -g window-status-current-format "#[fg=colour235,bg=colour81,bold] #I:#W#F #[fg=colour81,bg=colour235,nobold]"
setw -g window-status-activity-style "fg=colour214,bg=colour235"
setw -g window-status-bell-style "fg=colour203,bg=colour235,bold"

set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour81,bold"
set -g pane-border-status off            # no top title bar → no wasted rows
set -g display-panes-colour "colour81"
set -g display-panes-active-colour "colour214"
set -g message-style "fg=colour235,bg=colour214,bold"
set -g message-command-style "fg=colour235,bg=colour81"
set -g mode-style "fg=colour235,bg=colour81"

# ------------------------------------------------------------
#  Session management
# ------------------------------------------------------------
# Alt + d  detach (session keeps running in the background)
bind -n M-d detach-client

# Alt + D  detach every OTHER client attached to the server
bind -n M-D detach-client -a

# Alt + s  interactive session picker (tree mode)
bind -n M-s choose-session

# Alt + w  full tree: sessions / windows / panes
bind -n M-w choose-tree -Zs

# Alt + $  rename current session (same as prefix + $)
bind -n M-$ command-prompt -I "#S" "rename-session '%%'"

# Alt + N  new session
bind -n M-N new-session

# Alt + S  kill current session (with confirmation)
bind -n M-S confirm-before -p "kill session #S? (y/n)" kill-session

# ------------------------------------------------------------
#  Windows
# ------------------------------------------------------------
# Alt + c  new window
bind -n M-c new-window

# Alt + n / Alt + p  next / previous window
bind -n M-n next-window
bind -n M-p previous-window

# Alt + l  switch to the last active window
bind -n M-l last-window

# Alt + &  kill window (with confirmation)
bind -n M-& kill-window

# Alt + ,  rename window
bind -n M-, command-prompt -I "#W" "rename-window '%%'"

# Alt + .  move window to another index
bind -n M-. command-prompt "move-window -t '%%'"

# Alt + 0..9  jump straight to window 0..9
#   (windows are numbered from 1, so these mirror prefix + 0..9)
bind -n M-0 select-window -t :=0
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Alt + '  prompt for a window index (any number)
bind -n M-\' command-prompt -p "window:" "select-window -t ':%%'"

# ------------------------------------------------------------
#  Panes
# ------------------------------------------------------------
# Alt + h/j/k/l  move between panes (vim style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt + \  split horizontally (side by side), same directory
bind -n M-\\ split-window -h -c "#{pane_current_path}"

# Alt + -  split vertically (top / bottom), same directory
bind -n M-- split-window -v -c "#{pane_current_path}"

# Alt + x  kill current pane (with confirmation)
bind -n M-x kill-pane

# Alt + z  toggle pane zoom (maximize / restore)
bind -n M-z resize-pane -Z

# Alt + o  next pane
bind -n M-o select-pane -t :.+

# Alt + ;  previous (last active) pane
bind -n 'M-;' select-pane -l

# Alt + q  show pane numbers (press the number to jump)
bind -n M-q display-panes

# Alt + Shift+H / Shift+L  swap pane with the one above / below
bind -n M-H swap-pane -U
bind -n M-L swap-pane -D

# Alt + =  spread all panes evenly (tiled)
bind -n M-= select-layout tiled

# Alt + Ctrl+h/j/k/l  resize panes (repeatable: hold and tap)
bind -r -n C-M-h resize-pane -L 5
bind -r -n C-M-j resize-pane -D 5
bind -r -n C-M-k resize-pane -U 5
bind -r -n C-M-l resize-pane -R 5

# Alt + | / _  break the pane out into its own window
bind -n M-\| break-pane
bind -n M-_ break-pane

# ------------------------------------------------------------
#  Copy / paste  (vi mode, with system clipboard)
# ------------------------------------------------------------
# Alt + [  enter copy mode
bind -n M-[ copy-mode

# Alt + ]  paste the most recent buffer
bind -n M-] paste-buffer -p

# Inside copy mode: vi motions (h/j/k/l, w/b, /, n) work as-is;
# `v` starts a selection and `y`/Enter copies it to the system
# clipboard (set-clipboard on above → OSC 52).
# Prefix + ] opens the full buffer list; prefix + = lists buffers.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ------------------------------------------------------------
#  Misc / help
# ------------------------------------------------------------
# Alt + ?  list every binding (with descriptions)
bind -n M-? list-keys -N

# Alt + :  tmux command prompt
bind -n M-: command-prompt

# Alt + r  reload this file
bind -n M-r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Alt + /  describe a key (shows help for the next key you press)
bind -n M-/ command-prompt -I "key:" "run-shell \"tmux lsk -N '%%'\""

# Alt + PgUp / PgDn  scroll back / forward without leaving the keyboard
bind -n M-PPage copy-mode -u
bind -n M-NPage send-keys -X page-down
