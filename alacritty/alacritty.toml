
[general]
live_config_reload = true
working_directory = "/home/nakatam/terminal"

import = [
    "~/.config/alacritty/themes/themes/hyper.toml"
]

[window]
decorations = "none"
dynamic_padding = false
opacity = 0.8
title = "Alacritty@CachyOS"

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12

[font.normal]
family = "monospace"
style = "Regular"

[font.bold]
family = "monospace"
style = "Bold"

[font.italic]
family = "monospace"
style = "Italic"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = "Underline"
vi_mode_style = "None"
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
# Custom CSI-u bindings for Ctrl+Backspace and Ctrl+Delete (for tmux/apps)
[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u001b[127;5u"

[[keyboard.bindings]]
key = "Delete"
mods = "Control"
chars = "\u001b[3;5~"
