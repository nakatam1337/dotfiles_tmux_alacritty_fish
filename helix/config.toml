[keys.normal]
C-s = ":write"
C-space = ":reload"
"R" = ":reload-all"

[keys.insert]
# C-s = ":write"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "block"


[editor.soft-wrap]
enable = true
